<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Best Study Snack</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      background: #f0f2f5;
      margin: 0;
      padding-top: 60px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      text-align: center;
      width: 420px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .protein { background: #4ade80; }
    .chips { background: #fbbf24; }
    .fruit { background: #f87171; }

    #status {
      margin-top: 15px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Best study snack?</h1>

    <div class="button-group">
      <button class="protein" onclick="castVote('Protein Bar')">💪 Protein Bar</button>
      <button class="chips" onclick="castVote('Chips')">🍟 Chips</button>
      <button class="fruit" onclick="castVote('Fruit')">🍎 Fruit</button>
    </div>

    <canvas id="voteChart"></canvas>
    <div id="status">Connecting to database...</div>
  </div>

<script>
  const SUPABASE_URL = "https://bgcyvbbkytlowjdzmado.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_IiL_yniqOyQjjWcYEZEpQg_RbcLDlAk";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let myChart;

  const voteCounts = {
    "Protein Bar": 0,
    "Chips": 0,
    "Fruit": 0
  };

  function initChart() {
    const ctx = document.getElementById("voteChart").getContext("2d");
    myChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: ["Protein Bar", "Chips", "Fruit"],
        datasets: [{
          label: "Votes",
          data: [0,0,0]
        }]
      },
      options: {
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  }

  function updateChart() {
    myChart.data.datasets[0].data = [
      voteCounts["Protein Bar"],
      voteCounts["Chips"],
      voteCounts["Fruit"]
    ];
    myChart.update();
  }

  async function castVote(choice) {
    const { error } = await supabaseClient
      .from("votes")
      .insert([{ choice }]);

    if (error) {
      console.error(error);
      document.getElementById("status").innerText = "Vote failed.";
    } else {
      document.getElementById("status").innerText = "Vote recorded!";
    }
  }

  async function loadVotes() {
    const { data, error } = await supabaseClient
      .from("votes")
      .select("choice");

    if (error) {
      console.error(error);
      return;
    }

    data.forEach(v => {
      if (voteCounts[v.choice] !== undefined) {
        voteCounts[v.choice]++;
      }
    });

    updateChart();
    document.getElementById("status").innerText = "Live and working!";
  }

  function setupRealtime() {
    supabaseClient
      .channel("votes")
      .on(
        "postgres_changes",
        { event: "INSERT", schema: "public", table: "votes" },
        (payload) => {
          const choice = payload.new.choice;
          if (voteCounts[choice] !== undefined) {
            voteCounts[choice]++;
            updateChart();
          }
        }
      )
      .subscribe();
  }

  async function start() {
    initChart();
    await loadVotes();
    setupRealtime();
  }

  start();
</script>
</body>
</html>
